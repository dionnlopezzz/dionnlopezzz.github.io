<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Saya</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      margin: 0;
      padding: 40px 20px;
    }

    /* Kotak putih di tengah */
    .kotak {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #6366f1;
    }

    h1 {
      margin-bottom: 5px;
      color: #1f2937;
    }

    h2 {
      color: #6366f1;
      margin-top: 30px;
    }

    .kampus {
      color: #6b7280;
    }

    /* Label skill */
    .skill span {
      display: inline-block;
      background: #e0e7ff;
      color: #4338ca;
      padding: 6px 16px;
      border-radius: 20px;
      margin: 4px;
    }

    /* Tombol kontak */
    .tombol {
      display: inline-block;
      background: #6366f1;
      color: white;
      padding: 10px 22px;
      border-radius: 25px;
      text-decoration: none;
      margin: 5px;
    }

    .tombol:hover {
      background: #4338ca;
    }
  </style>
</head>

<body>

  <div class="kotak">

    <img src="foto.jpg" alt="Foto Saya">
    <h1>DIONDO TUA SIANTURI</h1>
    <p class="kampus">Mahasiswa UNIVERSITAS MEDAN AREA</p>

    <h2>Tentang Saya</h2>
    <p>Saya sedang belajar membuat website dengan HTML, CSS, dan GitHub.</p>

    <h2>Skill</h2>
    <div class="skill">
      <span>HTML</span>
      <span>CSS</span>
      <span>GitHub</span>
      <span>Komunikasi</span>
    </div>

    <h2>Proyek</h2>
    <p>1. Website Portofolio Pribadi</p>


    <h2>Kontak</h2>
<span class="tombol">Email: emailkamu@gmail.com</span>
<span class="tombol">No. HP: 0812 3456 7890</span>

  </div>

</body>
</html>
